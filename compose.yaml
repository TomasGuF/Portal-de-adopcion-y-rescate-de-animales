services:
  postgres:
    image: postgres:16-alpine
    container_name: patitasgo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: patitasgo
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - patitasgo_db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d patitasgo']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  patitasgo_db:
