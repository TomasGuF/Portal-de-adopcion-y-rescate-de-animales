name: EP2 backend tests
on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/ep2-backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/ep2-backend.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: patitasgo_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/patitasgo_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/patitasgo_test
      JWT_SECRET: test-only-secret-which-is-longer-than-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run db:seed # Comprobar idempotencia
      - run: npm test
