name: EP2 frontend build
on:
  push:
    paths:
      - 'src/**'
      - 'cypress/**'
      - 'cypress.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - '.github/workflows/ep2-frontend.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - '.github/workflows/ep2-frontend.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Start Vite and wait for readiness
        run: |
          (npm run dev -- --host 127.0.0.1 --port 5173 --strictPort > /tmp/patitas-vite.log 2>&1 &)
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/patitas-vite.log
          exit 1
      - name: Run browser regression
        run: npx cypress run --spec cypress/e2e/postulaciones.cy.ts --browser electron
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: postulaciones-browser-failure
          path: |
            cypress/screenshots/
            /tmp/patitas-vite.log
          if-no-files-found: ignore
