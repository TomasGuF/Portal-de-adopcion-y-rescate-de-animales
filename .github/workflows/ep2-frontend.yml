name: EP2 frontend build
on:
  push:
    paths:
      - 'src/**'
      - 'cypress/**'
      - 'cypress.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - '.github/workflows/ep2-frontend.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - '.github/workflows/ep2-frontend.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: cypress-io/github-action@v6
        with:
          install-command: npm ci
          start: npm run dev -- --host 127.0.0.1 --port 5173 --strictPort
          wait-on: 'http://127.0.0.1:5173'
          wait-on-timeout: 120
          spec: cypress/e2e/postulaciones.cy.ts
